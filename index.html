<!DOCTYPE html>
<html>
<head>
<title>DNS Checker Tool</title>
<style>
body {
font-family: Arial;
margin: 40px;
}
.pass {
color: green;
font-weight: bold;
}
.fail {
color: red;
font-weight: bold;
}
.no-record {
color: red;
}
.warn {
color: orange;
font-weight: bold;
}
.box {
border: 1px solid #ccc;
padding: 15px;
margin-top: 15px;
border-radius: 6px;
text-align: left;
}
.copy {
cursor: pointer;
padding: 5px 10px;
margin-top: 5px;
background: ;
color: #fff;
border: none;
border-radius: 4px;
}
.instructions {
border: 1px solid #ccc;
background: ;
padding: 15px;
margin-top: 30px;
border-radius: 6px;
}
.instructions h3 {
margin-top: 0;
}
pre {
background: #eee;
padding: 10px;
border-radius: 4px;
white-space: pre-wrap;
}
.container {
max-width: 800px;
margin: 0 auto;
}
</style>
</head>
<body>
<div class="container">
<p style="text-align:center; font-size:24px; font-weight:bold;">DNS Checker Tool</p>
<div style="display:flex; justify-content:center; align-items:center; gap:8px; margin-bottom:20px;">
<input id="domain" placeholder="Enter domain" style="width:300px; padding:8px;">
<button onclick="checkDNS()" style="padding:8px 12px;">Check DNS</button>
</div>
<div id="results"></div>
<div style="margin-top:40px; font-size:14px; color:#555; text-align:center;">
Powered by MyCRM Technology Support
<div style="margin-top:10px; font-size:11px; color:#aaa; text-align:center;">
v1.3.0
</div>
</div>
<div id="instructions-copyable" class="instructions" style="display:none;">
<p style="font-size:16px; font-weight:bold; margin-top:0;">DNS Records Instructions (Copy & Apply)</p>
<pre id="copyableInstructions"></pre>
<button class="copy" onclick="copyInstructions()">Copy All Instructions</button>
</div>
<div id="instructions-noncopyable" class="instructions" style="display:none;">
<p style="font-size:16px; font-weight:bold; margin-top:0;">Next Steps: (Requires access to Mandrill/SendGrid or assistance from MyCRM Technology Support)</p>
<pre id="nonCopyableInstructions"></pre>
</div>
</div>
<script>
async function fetchDNS(name, type){
const url = "https://cloudflare-dns.com/dns-query?name=" + name + "&type=" + type;
const res = await fetch(url, { headers: { "Accept": "application/dns-json" } });
const data = await res.json();
return data.Answer ? data.Answer.map(r => r.data.replace(/"/g, "")) : [];
}

function noRecord(){
return "<span class='no-record'>No record found</span>";
}

// Auto-append detection helper
async function checkAutoAppend(host, type, domain){
const normal = await fetchDNS(host, type);
if(normal.length > 0) return { records: normal, autoAppend: false };
const doubled = await fetchDNS(host + "." + domain, type);
if(doubled.length > 0) return { records: doubled, autoAppend: true };
return { records: [], autoAppend: false };
}

async function checkDNS(){
const domain = document.getElementById("domain").value.trim();
if(!domain) return alert("Please enter a domain");
let resultsHTML = "";
const copyable = [];
const nonCopyable = [];
let globalAutoAppend = false;

try{
const txtRecords = await fetchDNS(domain, "TXT");

// 1. SPF
const spfRecord = txtRecords.find(r =>
r.includes("include:sendgrid.net") && r.includes("include:spf.mandrillapp.com")
);
const spfPass = !!spfRecord;
const spfRaw = txtRecords.find(r => r.includes("spf1")) || noRecord();
resultsHTML += "<div class='box'>SPF: <span class='" + (spfPass?"pass":"fail") + "'>" + (spfPass?"PASS":"FAIL") + "</span><br><small>Raw value: " + spfRaw + "</small></div>";
if(!spfPass){
copyable.push(
"SPF TXT Record:\n" +
"(Note: Add to existing SPF, do NOT create new if exists)\n\n" +
"Type: TXT\n" +
"Host: @\n" +
"Value: v=spf1 include:sendgrid.net include:spf.mandrillapp.com ~all"
);
}

// 2. Mandrill Verify
const mandrillRecords = txtRecords.filter(r => r.startsWith("mandrill_verify"));
if(mandrillRecords.length > 0){
const spacingIssue = mandrillRecords.some(r => r !== r.trim());
if(spacingIssue){
resultsHTML += "<div class='box'>Mandrill Verify: <span class='fail'>INVALID</span><br><small>Space found in record.</small><br><small>Raw value: " + mandrillRecords.join(", ") + "</small></div>";
nonCopyable.push("Mandrill Verify:\nSpace found in record.\nRaw value: " + mandrillRecords.join(", ") + "\nPlease remove leading/trailing spaces.");
} else {
resultsHTML += "<div class='box'>Mandrill Verify: <span class='pass'>PASS</span><br><small>Raw value: " + mandrillRecords.join(", ") + "</small></div>";
}
} else {
resultsHTML += "<div class='box'>Mandrill Verify: <span class='fail'>FAIL</span><br><small>" + noRecord() + "</small></div>";
nonCopyable.push("Mandrill Verify:\nNo TXT record found.\nPlease log in to Mandrill to retrieve the verification TXT record for this domain.");
}

// 3. DMARC with auto-append detection
const dmarcHost = "_dmarc." + domain;
const dmarcResult = await checkAutoAppend(dmarcHost, "TXT", domain);
if(dmarcResult.autoAppend) globalAutoAppend = true;
const dmarcRecords = dmarcResult.records;
const dmarcPass = dmarcRecords.some(r =>
r.includes("v=DMARC1") && (r.includes("p=none") || r.includes("p=quarantine"))
) && !dmarcResult.autoAppend;
const dmarcAutoWarn = dmarcResult.autoAppend ?
"<br><small style='color:orange;'>⚠️ Auto-appending detected on DMARC record! The record is publicly resolving as _dmarc." + domain + "." + domain + " instead of _dmarc." + domain + ". Use short host name: _dmarc instead so it would resolve correctly to _dmarc." + domain + "</small>" : "";
resultsHTML += "<div class='box'>DMARC: <span class='" + (dmarcPass?"pass":"fail") + "'>" + (dmarcPass?"PASS":"FAIL") + "</span>" + dmarcAutoWarn + "<br><small>Expected host: _dmarc." + domain + "</small><br><small>Raw value: " + (dmarcRecords.join(", ") || noRecord()) + "</small></div>";
if(!dmarcPass){
const dmarcHostVal = dmarcResult.autoAppend ? "_dmarc" : "_dmarc." + domain;
copyable.push(
"DMARC TXT Record:\n\n" +
"Type: TXT\n" +
"Host: " + dmarcHostVal + "\n" +
"Value: v=DMARC1; p=none;" +
(dmarcResult.autoAppend ? "\n\n⚠️ Note: Your DNS provider auto-appends the domain. Use the short host name above and it will automatically resolve to _dmarc." + domain : "")
);
}

// 4. DKIM with auto-append detection
const dkim1Result = await checkAutoAppend("mte1._domainkey." + domain, "CNAME", domain);
const dkim2Result = await checkAutoAppend("mte2._domainkey." + domain, "CNAME", domain);
const dkimAutoAppend = dkim1Result.autoAppend || dkim2Result.autoAppend;
if(dkimAutoAppend) globalAutoAppend = true;
const dkim1Records = dkim1Result.records;
const dkim2Records = dkim2Result.records;
const normalizeSingle = arr => arr.map(r => r.replace(/\.$/, "").toLowerCase().trim());
const dkim1Pass = normalizeSingle(dkim1Records).includes("dkim1.mandrillapp.com") && !dkim1Result.autoAppend;
const dkim2Pass = normalizeSingle(dkim2Records).includes("dkim2.mandrillapp.com") && !dkim2Result.autoAppend;
const dkimPass = dkim1Pass && dkim2Pass;
const dkimAutoWarn = dkimAutoAppend ?
"<br><small style='color:orange;'>⚠️ Auto-appending detected on DKIM records! The records are publicly resolving as:" +
(dkim1Result.autoAppend ? "<br>mte1._domainkey." + domain + "." + domain + " instead of mte1._domainkey." + domain : "") +
(dkim2Result.autoAppend ? "<br>mte2._domainkey." + domain + "." + domain + " instead of mte2._domainkey." + domain : "") +
"<br>Use short host names: mte1._domainkey and mte2._domainkey instead so they would resolve correctly to mte1._domainkey." + domain + " and mte2._domainkey." + domain + "</small>" : "";
resultsHTML += "<div class='box'>DKIM: <span class='" + (dkimPass?"pass":"fail") + "'>" + (dkimPass?"PASS":"FAIL") + "</span>" + dkimAutoWarn + "<br><small>mte1._domainkey." + domain + " -> " + (dkim1Result.autoAppend ? "resolving as mte1._domainkey." + domain + "." + domain + " (auto-append detected)" : (dkim1Records.join(", ") || noRecord())) + "</small><br><small>mte2._domainkey." + domain + " -> " + (dkim2Result.autoAppend ? "resolving as mte2._domainkey." + domain + "." + domain + " (auto-append detected)" : (dkim2Records.join(", ") || noRecord())) + "</small></div>";
if(!dkimPass){
let dkimInstructions = "DKIM CNAME Records:\n";
if(!dkim1Pass){
dkimInstructions +=
"\nType: CNAME\n" +
"Host: " + (dkim1Result.autoAppend ? "mte1._domainkey" : "mte1._domainkey." + domain) + "\n" +
"Value: dkim1.mandrillapp.com";
}
if(!dkim2Pass){
dkimInstructions +=
"\n\nType: CNAME\n" +
"Host: " + (dkim2Result.autoAppend ? "mte2._domainkey" : "mte2._domainkey." + domain) + "\n" +
"Value: dkim2.mandrillapp.com";
}
if(dkimAutoAppend){
dkimInstructions += "\n\n⚠️ Note: Your DNS provider auto-appends the domain. Use the short host names above and they will automatically resolve to mte1._domainkey." + domain + " and mte2._domainkey." + domain;
}
copyable.push(dkimInstructions.trim());
}

// 5. CustomerIO/SendGrid with auto-append detection
const cioResult = await checkAutoAppend("customerio." + domain, "CNAME", domain);
const sg1Result = await checkAutoAppend("sg1._domainkey." + domain, "CNAME", domain);
const sg12Result = await checkAutoAppend("sg12._domainkey." + domain, "CNAME", domain);
const sgAutoAppend = cioResult.autoAppend || sg1Result.autoAppend || sg12Result.autoAppend;
if(sgAutoAppend) globalAutoAppend = true;
const cioRecords = cioResult.records;
const sg1Records = sg1Result.records;
const sg12Records = sg12Result.records;
const normalizeCname = arr => arr.map(r => r.replace(/\.$/, "").toLowerCase().trim());
const hasDuplicateCio = cioRecords.length !== new Set(cioRecords).size;
const hasDuplicateSg1 = sg1Records.length !== new Set(sg1Records).size;
const hasDuplicateSg12 = sg12Records.length !== new Set(sg12Records).size;
const hasSpaceCio = cioRecords.some(r => r !== r.trim());
const hasSpaceSg1 = sg1Records.some(r => r !== r.trim());
const hasSpaceSg12 = sg12Records.some(r => r !== r.trim());
const cioPass = normalizeCname(cioRecords).includes("u11692406.wl157.sendgrid.net") && !hasDuplicateCio && !hasSpaceCio && !cioResult.autoAppend;
const sg1Pass = normalizeCname(sg1Records).includes("sg1.domainkey.u11692406.wl157.sendgrid.net") && !hasDuplicateSg1 && !hasSpaceSg1 && !sg1Result.autoAppend;
const sg12Pass = normalizeCname(sg12Records).includes("sg12.domainkey.u11692406.wl157.sendgrid.net") && !hasDuplicateSg12 && !hasSpaceSg12 && !sg12Result.autoAppend;
const allCioPass = cioPass && sg1Pass && sg12Pass;
const sgAutoWarn = sgAutoAppend ?
"<br><small style='color:orange;'>⚠️ Auto-appending detected on SendGrid/CustomerIO records! The records are publicly resolving as:" +
(cioResult.autoAppend ? "<br>customerio." + domain + "." + domain + " instead of customerio." + domain : "") +
(sg1Result.autoAppend ? "<br>sg1._domainkey." + domain + "." + domain + " instead of sg1._domainkey." + domain : "") +
(sg12Result.autoAppend ? "<br>sg12._domainkey." + domain + "." + domain + " instead of sg12._domainkey." + domain : "") +
"<br>Use short host names instead so they resolve correctly.</small>" : "";
resultsHTML += "<div class='box'>CustomerIO/SendGrid: <span class='" + (allCioPass?"pass":"fail") + "'>" + (allCioPass?"PASS":"FAIL") + "</span>" + sgAutoWarn +
"<br><small>customerio." + domain + " -> " + (cioResult.autoAppend ? "resolving as customerio." + domain + "." + domain + " (auto-append detected)" : (cioRecords.join(", ") || noRecord())) + "</small>" +
"<br><small>sg1._domainkey." + domain + " -> " + (sg1Result.autoAppend ? "resolving as sg1._domainkey." + domain + "." + domain + " (auto-append detected)" : (sg1Records.join(", ") || noRecord())) + "</small>" +
"<br><small>sg12._domainkey." + domain + " -> " + (sg12Result.autoAppend ? "resolving as sg12._domainkey." + domain + "." + domain + " (auto-append detected)" : (sg12Records.join(", ") || noRecord())) + "</small></div>";
if(!allCioPass){
let msg = "CustomerIO / SendGrid CNAME Records:\n";
if(!cioPass){
if(cioResult.autoAppend){
msg += "\nType: CNAME\nHost: customerio\nValue: u11692406.wl157.sendgrid.net";
} else if(cioRecords.length === 0){
msg += "\nType: CNAME\nHost: customerio." + domain + "\nValue: u11692406.wl157.sendgrid.net";
} else if(hasDuplicateCio){
msg += "\ncustomerio." + domain + ": Duplicate records found.";
} else if(hasSpaceCio){
msg += "\ncustomerio." + domain + ": Space found in record.";
} else {
msg += "\ncustomerio." + domain + ": Incorrect value - expected u11692406.wl157.sendgrid.net";
}
}
if(!sg1Pass){
if(sg1Result.autoAppend){
msg += "\n\nType: CNAME\nHost: sg1._domainkey\nValue: sg1.domainkey.u11692406.wl157.sendgrid.net";
} else if(sg1Records.length === 0){
msg += "\n\nType: CNAME\nHost: sg1._domainkey." + domain + "\nValue: sg1.domainkey.u11692406.wl157.sendgrid.net";
} else if(hasDuplicateSg1){
msg += "\nsg1._domainkey." + domain + ": Duplicate records found.";
} else if(hasSpaceSg1){
msg += "\nsg1._domainkey." + domain + ": Space found in record.";
} else {
msg += "\nsg1._domainkey." + domain + ": Incorrect value - expected sg1.domainkey.u11692406.wl157.sendgrid.net";
}
}
if(!sg12Pass){
if(sg12Result.autoAppend){
msg += "\n\nType: CNAME\nHost: sg12._domainkey\nValue: sg12.domainkey.u11692406.wl157.sendgrid.net";
} else if(sg12Records.length === 0){
msg += "\n\nType: CNAME\nHost: sg12._domainkey." + domain + "\nValue: sg12.domainkey.u11692406.wl157.sendgrid.net";
} else if(hasDuplicateSg12){
msg += "\nsg12._domainkey." + domain + ": Duplicate records found.";
} else if(hasSpaceSg12){
msg += "\nsg12._domainkey." + domain + ": Space found in record.";
} else {
msg += "\nsg12._domainkey." + domain + ": Incorrect value - expected sg12.domainkey.u11692406.wl157.sendgrid.net";
}
}
if(sgAutoAppend){
msg += "\n\n⚠️ Note: Your DNS provider auto-appends the domain. Use the short host names above and they will automatically resolve correctly.";
}
nonCopyable.push(msg.trim());
}

// Global auto-append warning banner
if(globalAutoAppend){
resultsHTML = "<div class='box' style='border-color:orange; background:#fff8e1;'>" +
"⚠️ <strong>Heads Up — Your DNS Provider is Auto-Appending!</strong><br><br>" +
"We detected something important about how your DNS provider (e.g. GoDaddy) handles DNS records. " +
"When you add a DNS record, your provider <strong>automatically adds your domain name to the end</strong> of whatever host value you type in. This is called <strong>Auto-Appending</strong>.<br><br>" +
"<strong>Here is a simple example of what happens:</strong><br>" +
"Imagine your domain is <em>" + domain + "</em> and you are asked to enter a host value of:<br>" +
"`mte1._domainkey." + domain + "`<br><br>" +
"Because your DNS provider auto-appends, it will automatically add your domain to the end, resulting in:<br>" +
"`mte1._domainkey." + domain + "." + domain + "` ❌<br><br>" +
"This looks correct in your DNS panel but it is actually broken behind the scenes — which is why the records are not resolving correctly publicly.<br><br>" +
"<strong>What you need to do instead:</strong><br>" +
"When adding DNS records, use the <strong>short host name only</strong> — without your domain name at the end. Your DNS provider will automatically add the domain for you.<br><br>" +
"For example, instead of typing:<br>" +
"`mte1._domainkey." + domain + "`<br>" +
"Just type:<br>" +
"`mte1._domainkey` ✅<br><br>" +
"Your DNS provider will handle the rest and the final result will correctly resolve to `mte1._domainkey." + domain + "`.<br><br>" +
"<strong>This applies to ALL DNS records</strong> — including DKIM, SendGrid, CustomerIO and DMARC. " +
"Please check the individual records below for the exact short host names to use. " +
"If you are unsure, please contact MyCRM Technology Support for assistance." +
"</div>" + resultsHTML;
}

} catch(e){
resultsHTML += "<div class='box'>ERROR: Could not check DNS. Try again later.</div>";
}

document.getElementById("results").innerHTML = resultsHTML;
document.getElementById("copyableInstructions").innerText = copyable.join("\n\n");
document.getElementById("instructions-copyable").style.display = copyable.length > 0 ? "block" : "none";
document.getElementById("nonCopyableInstructions").innerText = nonCopyable.join("\n\n");
document.getElementById("instructions-noncopyable").style.display = nonCopyable.length > 0 ? "block" : "none";
}

function copyInstructions(){
const text = document.getElementById("copyableInstructions").innerText;
navigator.clipboard.writeText(text);
const btn = document.querySelector(".copy");
const original = btn.innerText;
btn.innerText = "Copied!";
btn.style.background = "";
setTimeout(() => {
btn.innerText = original;
btn.style.background = "";
}, 2000);
}
</script>
</body>
</html>
